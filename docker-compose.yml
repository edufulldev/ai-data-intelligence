services:
  postgres-ai:
    image: postgres:16
    container_name: postgres-ai-intelligence
    environment:
      POSTGRES_DB: ai_intelligence_db
      POSTGRES_USER: ai_user
      POSTGRES_PASSWORD: ai_password
    ports:
      - "5436:5432"
    volumes:
      - postgres_ai_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_user -d ai_intelligence_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_ai_data:
